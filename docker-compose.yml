services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-agent-bot:latest
    container_name: tg-bot-gateway
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_TIMEOUT=60.0
      - SECRETS_DIR=/run/secrets
      - SYSTEM_PROMPT=Ты умный, полезный и вежливый ИИ-ассистент. Всегда отвечай строго на грамотном русском языке (или на языке вопроса пользователя). Никогда не используй китайские иероглифы.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - telegram_bot_token
      - allowed_user_ids
    # Docker Sandbox Security Hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  allowed_user_ids:
    file: ./secrets/allowed_user_ids.txt
